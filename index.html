<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Fandom - App</title>
    <style>
        /* Base Variables for Light Theme */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --input-border: #ccc;
            --badge-bg: #eef2f7;
            --modal-bg: rgba(0, 0, 0, 0.6);
        }

        /* Dark Theme Overrides */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f4f4f9;
            --card-bg: #1e1e1e;
            --input-border: #444;
            --badge-bg: #333;
        }

        body { font-family: Arial, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px auto; }
        h1 { color: #e91e63; margin: 0; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        /* Buttons */
        .theme-btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--input-border); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .unlock-btn { background: linear-gradient(45deg, #f39c12, #e74c3c); color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; transition: 0.3s; }
        .unlock-btn.active { background: linear-gradient(45deg, #28a745, #218838); pointer-events: none; }

        /* Filter layout */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto 30px auto;
            transition: background 0.3s;
        }
        .filters input, .filters select {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* Profile Layout */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .profile-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: background 0.3s; }
        
        /* Main Slider Layout */
        .img-container { position: relative; width: 100%; height: 350px; overflow: hidden; background: #000; }
        .slider-track { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease-in-out; }
        .slider-track img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px 12px; cursor: pointer; z-index: 5; font-weight: bold; border-radius: 4px; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        
        /* Small Thumbnails Section */
        .thumbnails-section { padding: 12px 15px 0 15px; }
        .thumbnails-track { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .thumbnails-track::-webkit-scrollbar { display: none; }
        
        .thumbnail-wrapper {
            position: relative;
            width: 60px; 
            height: 60px; 
            border-radius: 6px; 
            border: 1px solid var(--input-border); 
            background: #000;
            flex-shrink: 0;
            overflow: hidden;
            transition: 0.3s;
        }

        .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* Locked State Styles */
        .thumbnail-wrapper.locked { cursor: pointer; }
        .thumbnail-wrapper.locked img { filter: blur(6px); transform: scale(1.2); }
        .thumbnail-lock { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); color: white; font-size: 16px; pointer-events: none; }
        
        .profile-info { padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: var(--badge-bg); padding: 4px 8px; border-radius: 4px; font-size: 12px; width: fit-content; }
        .protected-data { filter: blur(4px); user-select: none; }
        .loading { text-align: center; font-size: 18px; color: #666; }

        /* Payment Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h2 { margin-top: 0; color: var(--text-color); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 6px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); font-size: 14px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 5px; display: none; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Only Fandom</h1>
        <div class="header-actions">
            <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode">🌙</button>
            <button id="vipBtn" class="unlock-btn" onclick="openModal()">⭐ Unlock VIP</button>
        </div>
    </header>

    <div class="filters">
        <select id="sortPrice">
            <option value="default">Sort by Price</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
        </select>
        <input type="number" id="minAge" placeholder="Min Age">
        <input type="number" id="maxAge" placeholder="Max Age">
        <input type="number" id="minHeight" placeholder="Min Height">
        <input type="number" id="maxHeight" placeholder="Max Height">
        <input type="number" id="minPrice" placeholder="Min Price">
        <input type="number" id="maxPrice" placeholder="Max Price">
    </div>

    <div id="profileContainer" class="profile-grid">
        <div class="loading">Fetching profiles...</div>
    </div>

    <!-- VIP Payment Modal -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Unlock VIP Access</h2>
            <div class="form-group">
                <label>Card Number</label>
                <input type="number" id="cardNumber" placeholder="8-19 digits" required>
                <div id="cardError" class="error-msg">Invalid card number (must be 8-19 digits)</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>CVV</label>
                    <input type="number" id="cardCvv" placeholder="3 digits" required>
                    <div id="cvvError" class="error-msg">Invalid CVV</div>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Expiry Date</label>
                    <input type="text" id="cardExpiry" placeholder="MM/YY" required>
                </div>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cardName" placeholder="Name on card" required>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="submitPayment()">Submit Payment</button>
            </div>
        </div>
    </div>

    <script>
        let allProfiles = [];
        let isPremium = false; 

        // --- Theme Toggle Logic ---
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isDark ? '☀️' : '🌙';
        });

        // --- Modal Logic ---
        function openModal() {
            if (isPremium) return; // Prevent opening if already VIP
            document.getElementById('paymentModal').style.display = 'flex';
            
            // Reset errors and inputs
            document.getElementById('cardError').style.display = 'none';
            document.getElementById('cvvError').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function submitPayment() {
            const cardNumber = document.getElementById('cardNumber').value.trim();
            const cvv = document.getElementById('cardCvv').value.trim();
            const expiry = document.getElementById('cardExpiry').value.trim();
            const name = document.getElementById('cardName').value.trim();

            let isValid = true;

            // Validate Card Number (8 to 19 digits)
            if (!/^\d{8,19}$/.test(cardNumber)) {
                document.getElementById('cardError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('cardError').style.display = 'none';
            }

            // Validate CVV (exactly 3 digits)
            if (!/^\d{3}$/.test(cvv)) {
                document.getElementById('cvvError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('cvvError').style.display = 'none';
            }

            // Check if standard fields are filled
            if (expiry === '' || name === '') {
                alert('Please fill out all fields.');
                isValid = false;
            }

            if (isValid) {
                // Unlock Premium Features
                isPremium = true;
                closeModal();
                
                // Update UI Button
                const vipBtn = document.getElementById('vipBtn');
                vipBtn.innerHTML = '⭐ VIP Active';
                vipBtn.classList.add('active');
                
                // Re-render everything with Premium states unlocked
                filterProfiles();
                alert('Payment successful! VIP Features are now unlocked.');
            }
        }

        // --- Data Loading ---
        async function loadProfiles() {
            try {
                const response = await fetch('profiles.html');
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const scriptTag = doc.getElementById('profiles-data');
                
                if (scriptTag) {
                    allProfiles = JSON.parse(scriptTag.textContent);
                    renderProfiles(allProfiles);
                }
            } catch (error) {
                console.error("Error fetching profiles:", error);
                document.getElementById('profileContainer').innerHTML = '<p class="loading">Error loading data. Run via a local web server.</p>';
            }
        }

        // --- Rendering ---
        function renderProfiles(profiles) {
            const container = document.getElementById('profileContainer');
            container.innerHTML = '';

            if (profiles.length === 0) {
                container.innerHTML = '<p class="loading">No profiles match your filter options.</p>';
                return;
            }

            profiles.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                
                // Clear images inside the main slider
                const clearSlidesHtml = profile.images_clear.map(img => 
                    `<img src="${img}" alt="${profile.title} Clear">`
                ).join('');

                // Render thumbnails dynamically based on isPremium status
                const thumbnailsHtml = profile.images_blurred.map(img => {
                    if (isPremium) {
                        return `
                            <div class="thumbnail-wrapper">
                                <img src="${img}" alt="${profile.title} Unlocked">
                            </div>`;
                    } else {
                        return `
                            <div class="thumbnail-wrapper locked" onclick="openModal()">
                                <img src="${img}" alt="${profile.title} Locked">
                                <div class="thumbnail-lock">🔒</div>
                            </div>`;
                    }
                }).join('');

                // Display hidden data if Premium
                const phoneDisplay = isPremium ? "+8801783921045" : '<span class="protected-data">+88017XXXXXX</span>';

                card.innerHTML = `
                    <div class="img-container">
                        <div class="slider-track" id="track-${index}">
                            ${clearSlidesHtml}
                        </div>
                        ${profile.images_clear.length > 1 ? `
                            <button class="slider-btn prev-btn" onclick="moveSlide(${index}, -1)">&#10094;</button>
                            <button class="slider-btn next-btn" onclick="moveSlide(${index}, 1)">&#10095;</button>
                        ` : ''}
                    </div>
                    
                    <div class="thumbnails-section">
                        <div class="thumbnails-track">
                            ${thumbnailsHtml}
                        </div>
                    </div>

                    <div class="profile-info">
                        <h3>${profile.title}, ${profile.age}</h3>
                        <div class="badge">📍 ${profile.location}</div>
                        <p><strong>Height:</strong> ${profile.height} cm | <strong>Price:</strong> $${profile.price}</p>
                        <p>${profile.desc}</p>
                        <p><strong>Phone:</strong> ${phoneDisplay}</p>
                    </div>
                `;
                container.appendChild(card);
                card.dataset.slideIndex = 0;
                card.dataset.maxSlide = profile.images_clear.length;
            });
        }

        // --- Slider Logic ---
        window.moveSlide = function(cardIndex, direction) {
            const card = document.querySelectorAll('.profile-card')[cardIndex];
            let currentSlide = parseInt(card.dataset.slideIndex);
            const maxSlide = parseInt(card.dataset.maxSlide);

            currentSlide = (currentSlide + direction + maxSlide) % maxSlide;
            card.dataset.slideIndex = currentSlide;

            const track = document.getElementById(`track-${cardIndex}`);
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        };

        // --- Filtering & Sorting Logic ---
        function filterProfiles() {
            const sortVal = document.getElementById('sortPrice').value;
            const minAge = parseInt(document.getElementById('minAge').value) || null;
            const maxAge = parseInt(document.getElementById('maxAge').value) || null;
            const minHeight = parseInt(document.getElementById('minHeight').value) || null;
            const maxHeight = parseInt(document.getElementById('maxHeight').value) || null;
            const minPrice = parseInt(document.getElementById('minPrice').value) || null;
            const maxPrice = parseInt(document.getElementById('maxPrice').value) || null;

            // Filter
            let filtered = allProfiles.filter(p => {
                if (minAge !== null && p.age < minAge) return false;
                if (maxAge !== null && p.age > maxAge) return false;
                if (minHeight !== null && p.height < minHeight) return false;
                if (maxHeight !== null && p.height > maxHeight) return false;
                if (minPrice !== null && p.price < minPrice) return false;
                if (maxPrice !== null && p.price > maxPrice) return false;
                return true;
            });

            // Sort
            if (sortVal === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortVal === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            // Render
            renderProfiles(filtered);
        }

        // Attach event listeners to all inputs and the select dropdown
        document.querySelectorAll('.filters input, .filters select').forEach(input => {
            input.addEventListener('input', filterProfiles);
        });

        loadProfiles();
    </script>
</body>
</html>
