<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Fandom - App</title>
    <!-- Tesseract.js Library for Optical Character Recognition (Card Scanning) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        /* Base Variables for Light Theme */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --input-border: #ccc;
            --badge-bg: #eef2f7;
            --modal-bg: rgba(0, 0, 0, 0.7);
        }

        /* Dark Theme Overrides */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f4f4f9;
            --card-bg: #1e1e1e;
            --input-border: #444;
            --badge-bg: #333;
        }

        body { font-family: Arial, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 15px auto; }
        h1 { color: #e91e63; margin: 0; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        /* Highlight Promo Banner */
        .promo-banner {
            max-width: 900px;
            margin: 0 auto 20px auto;
            padding: 12px 20px;
            background: linear-gradient(135deg, #ff0055, #ff5000, #ffcc00);
            background-size: 200% 200%;
            animation: gradientPulse 3s ease infinite, scalePulse 2s infinite alternate;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes gradientPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes scalePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.015); }
        }

        /* Buttons */
        .theme-btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--input-border); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .unlock-btn { background: linear-gradient(45deg, #f39c12, #e74c3c); color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; transition: 0.3s; }
        .unlock-btn.active { background: linear-gradient(45deg, #28a745, #218838); pointer-events: none; }

        /* Filter layout */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto 30px auto;
            transition: background 0.3s;
        }
        .filters input, .filters select {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* Profile Layout */
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
        .profile-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: background 0.3s; }
        
        /* Main Slider Layout */
        .img-container { position: relative; width: 100%; height: 350px; overflow: hidden; background: #000; }
        .slider-track { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease-in-out; }
        .slider-track img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px 12px; cursor: pointer; z-index: 5; font-weight: bold; border-radius: 4px; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        
        /* Small Thumbnails Section */
        .thumbnails-section { padding: 12px 15px 0 15px; }
        .thumbnails-track { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .thumbnails-track::-webkit-scrollbar { display: none; }
        
        .thumbnail-wrapper { position: relative; width: 60px; height: 60px; border-radius: 6px; border: 1px solid var(--input-border); background: #000; flex-shrink: 0; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .thumbnail-wrapper.locked img { filter: blur(2px); transform: scale(1.1); }
        .thumbnail-lock { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); color: white; font-size: 16px; pointer-events: none; }
        
        .profile-info { padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: var(--badge-bg); padding: 4px 8px; border-radius: 4px; font-size: 12px; width: fit-content; }
        .protected-data { filter: blur(4px); user-select: none; }
        .loading { text-align: center; font-size: 18px; color: #666; }

        /* Payment Modal & Toggle */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h2 { margin-top: 0; color: var(--text-color); margin-bottom: 15px; text-align: center;}
        
        .method-toggle { display: flex; border: 1px solid var(--input-border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .method-toggle button { flex: 1; padding: 10px; border: none; background: var(--bg-color); color: var(--text-color); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .method-toggle button.active { background: #e91e63; color: white; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 6px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); font-size: 14px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 5px; display: none; }
        
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-cancel { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Camera Scanner Styles */
        #scanner-area { text-align: center; }
        #camera-stream { width: 100%; border-radius: 8px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .scan-status { margin-top: 10px; font-size: 14px; font-weight: bold; color: var(--text-color); }
        .scanning-frame { position: relative; margin-bottom: 15px; }
        .scanning-frame::after { content: ''; position: absolute; top: 10%; left: 5%; right: 5%; bottom: 10%; border: 2px dashed #e91e63; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); pointer-events: none; }

        /* Fullscreen Lightbox Modal */
        .lightbox-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .lightbox-overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; object-fit: contain; box-shadow: 0 5px 25px rgba(0,0,0,0.5); }
        .close-lightbox { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <header>
        <h1>Only Fandom</h1>
        <div class="header-actions">
            <button id="themeToggle" class="theme-btn" title="Toggle Dark Mode">🌙</button>
            <button id="vipBtn" class="unlock-btn" onclick="openModal()">⭐ Unlock VIP</button>
        </div>
    </header>

    <!-- Eye-Catching Promo Banner -->
    <div class="promo-banner">
        <span>⚡ FREE VIP unlock only for limited users avail the offer quickly! ⚡</span>
    </div>

    <div class="filters">
        <select id="sortPrice">
            <option value="default">Sort by Price</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
        </select>
        <input type="number" id="minAge" placeholder="Min Age">
        <input type="number" id="maxAge" placeholder="Max Age">
        <input type="number" id="minHeight" placeholder="Min Height">
        <input type="number" id="maxHeight" placeholder="Max Height">
        <input type="number" id="minPrice" placeholder="Min Price">
        <input type="number" id="maxPrice" placeholder="Max Price">
    </div>

    <div id="profileContainer" class="profile-grid">
        <div class="loading">Fetching profiles...</div>
    </div>

    <!-- VIP Payment Modal -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Unlock VIP Access</h2>
            
            <div class="method-toggle">
                <button id="btn-manual" class="active" onclick="switchMethod('manual')">Enter Manually</button>
                <button id="btn-scan" onclick="switchMethod('scan')">Scan Card</button>
            </div>

            <!-- Manual Form -->
            <div id="manual-form">
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="number" id="cardNumber" placeholder="8-19 digits" required>
                    <div id="cardError" class="error-msg">Invalid card number (must be 8-19 digits)</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>CVV (ggf)</label>
                        <input type="number" id="cardCvv" placeholder="3 digits" required>
                        <div id="cvvError" class="error-msg">Invalid CVV</div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Expiry Date</label>
                        <input type="text" id="cardExpiry" placeholder="MM/YY" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="cardName" placeholder="Name on card" required>
                </div>
                <div class="form-actions" style="margin-top: 10px;">
                    <button class="btn-cancel" style="width: auto;" onclick="closeModal()">Cancel</button>
                    <button class="btn-submit" style="flex: 1;" onclick="submitPayment()">Submit Payment</button>
                </div>
            </div>

            <!-- Scanner Form -->
            <div id="scanner-area" style="display: none;">
                <div class="scanning-frame">
                    <video id="camera-stream" autoplay playsinline></video>
                </div>
                <p id="scan-status" class="scan-status">Waiting for camera permission...</p>
                <div class="form-actions" style="justify-content: center;">
                    <button class="btn-cancel" onclick="closeModal()">Cancel Scanning</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Lightbox -->
    <div id="imageLightbox" class="lightbox-overlay" onclick="closeLightbox(event)">
        <span class="close-lightbox" onclick="closeLightbox(event)">&times;</span>
        <img id="lightbox-img" src="" alt="Blurred Full Screen View">
    </div>

    <!-- Hidden Canvas for Processing Frames -->
    <canvas id="ocr-canvas" style="display: none;"></canvas>

    <script>
        let allProfiles = [];
        let isPremium = false; 
        let videoStream = null;
        let ocrInterval = null;
        let isScanning = false;

        // --- Theme Toggle Logic ---
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isDark ? '☀️' : '🌙';
        });

        // --- Lightbox Logic ---
        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightbox.style.display = 'flex';
        }

        function closeLightbox(event) {
            if (event.target.id === 'imageLightbox' || event.target.className === 'close-lightbox') {
                document.getElementById('imageLightbox').style.display = 'none';
                document.getElementById('lightbox-img').src = '';
            }
        }

        // --- Payment Modal & Camera Logic ---
        function openModal() {
            if (isPremium) return; 
            document.getElementById('paymentModal').style.display = 'flex';
            switchMethod('manual');
            
            document.getElementById('cardError').style.display = 'none';
            document.getElementById('cvvError').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
            stopCamera();
        }

        function switchMethod(method) {
            const manualForm = document.getElementById('manual-form');
            const scannerArea = document.getElementById('scanner-area');
            const btnManual = document.getElementById('btn-manual');
            const btnScan = document.getElementById('btn-scan');

            if (method === 'manual') {
                manualForm.style.display = 'block';
                scannerArea.style.display = 'none';
                btnManual.classList.add('active');
                btnScan.classList.remove('active');
                stopCamera();
            } else if (method === 'scan') {
                manualForm.style.display = 'none';
                scannerArea.style.display = 'block';
                btnScan.classList.add('active');
                btnManual.classList.remove('active');
                startCamera();
            }
        }

        async function startCamera() {
            const videoElement = document.getElementById("camera-stream");
            const statusText = document.getElementById("scan-status");
            
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                
                videoElement.srcObject = videoStream;
                statusText.innerText = "Align your card in frame. Reading card data...";
                isScanning = true;
                
                videoElement.onloadedmetadata = () => {
                    startOCR(videoElement);
                };

            } catch (error) {
                console.error("Camera access error:", error);
                if (error.name === 'NotAllowedError') {
                    statusText.innerText = "Camera access denied. Please enter card manually.";
                } else {
                    statusText.innerText = "Camera not found or supported on this device.";
                }
                setTimeout(() => switchMethod('manual'), 2000);
            }
        }

        function stopCamera() {
            isScanning = false;
            if (ocrInterval) {
                clearInterval(ocrInterval);
                ocrInterval = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        // --- Real-time Card OCR Detection ---
        function startOCR(videoElement) {
            const canvas = document.getElementById("ocr-canvas");
            const ctx = canvas.getContext("2d");

            ocrInterval = setInterval(async () => {
                if (!isScanning) return;

                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                try {
                    const result = await Tesseract.recognize(canvas, 'eng');
                    const text = result.data.text;

                    const cardNumberPattern = /\b(?:\d[ -]*?){13,19}\b/;
                    const expiryPattern = /\b(0[1-9]|1[0-2])\/([0-9]{2}|[0-9]{4})\b/;

                    const cardMatch = text.match(cardNumberPattern);
                    const expiryMatch = text.match(expiryPattern);

                    if (cardMatch) {
                        const cleanCardNumber = cardMatch[0].replace(/[\s-]/g, '');
                        document.getElementById('cardNumber').value = cleanCardNumber;
                        
                        if (expiryMatch) {
                            document.getElementById('cardExpiry').value = expiryMatch[0];
                        }

                        stopCamera();
                        switchMethod('manual');
                        alert("Card details detected! Please verify the info and click Submit Payment.");
                    }
                } catch (ocrErr) {
                    console.error("OCR process error:", ocrErr);
                }
            }, 1500);
        }

        function submitPayment() {
            const cardNumber = document.getElementById('cardNumber').value.trim();
            const cvv = document.getElementById('cardCvv').value.trim();
            const expiry = document.getElementById('cardExpiry').value.trim();
            const name = document.getElementById('cardName').value.trim();
            let isValid = true;

            if (!/^\d{8,19}$/.test(cardNumber)) {
                document.getElementById('cardError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('cardError').style.display = 'none';
            }

            if (!/^\d{3}$/.test(cvv)) {
                document.getElementById('cvvError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('cvvError').style.display = 'none';
            }

            if (expiry === '' || name === '') {
                alert('Please fill out all fields.');
                isValid = false;
            }

            if (isValid) {
                activateVIP("Payment successful! VIP Features are now unlocked.");
            }
        }

        function activateVIP(successMessage) {
            isPremium = true;
            closeModal();
            
            const vipBtn = document.getElementById('vipBtn');
            vipBtn.innerHTML = '⭐ VIP Active';
            vipBtn.classList.add('active');
            
            filterProfiles();
            alert(successMessage);
        }

        // --- Data Loading ---
        async function loadProfiles() {
            try {
                const response = await fetch('profiles.html');
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const scriptTag = doc.getElementById('profiles-data');
                
                if (scriptTag) {
                    allProfiles = JSON.parse(scriptTag.textContent);
                    renderProfiles(allProfiles);
                }
            } catch (error) {
                console.error("Error fetching profiles:", error);
                document.getElementById('profileContainer').innerHTML = '<p class="loading">Error loading data. Run via a local web server.</p>';
            }
        }

        // --- Rendering ---
        function renderProfiles(profiles) {
            const container = document.getElementById('profileContainer');
            container.innerHTML = '';

            if (profiles.length === 0) {
                container.innerHTML = '<p class="loading">No profiles match your filter options.</p>';
                return;
            }

            profiles.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                
                // Hero slider STRICTLY contains CLEAR images only
                const clearSlidesHtml = profile.images_clear.map(img => 
                    `<img src="${img}" alt="${profile.title} Clear">`
                ).join('');

                // Thumbnails STRICTLY contain BLURRED images only
                const thumbnailsHtml = profile.images_blurred.map((blurredImg) => {
                    if (isPremium) {
                        return `
                            <div class="thumbnail-wrapper" onclick="openLightbox('${blurredImg}')">
                                <img src="${blurredImg}" alt="${profile.title} Blurred Thumbnail">
                            </div>`;
                    } else {
                        return `
                            <div class="thumbnail-wrapper locked" onclick="openModal()">
                                <img src="${blurredImg}" alt="${profile.title} Blurred Thumbnail">
                                <div class="thumbnail-lock">🔒</div>
                            </div>`;
                    }
                }).join('');

                const phoneDisplay = isPremium ? "+8801783921045" : '<span class="protected-data">+88017XXXXXX</span>';

                card.innerHTML = `
                    <div class="img-container">
                        <div class="slider-track" id="track-${index}">
                            ${clearSlidesHtml}
                        </div>
                        ${profile.images_clear.length > 1 ? `
                            <button class="slider-btn prev-btn" onclick="moveSlide(${index}, -1)">&#10094;</button>
                            <button class="slider-btn next-btn" onclick="moveSlide(${index}, 1)">&#10095;</button>
                        ` : ''}
                    </div>
                    
                    <div class="thumbnails-section">
                        <div class="thumbnails-track">
                            ${thumbnailsHtml}
                        </div>
                    </div>

                    <div class="profile-info">
                        <h3>${profile.title}, ${profile.age}</h3>
                        <div class="badge">📍 ${profile.location}</div>
                        <p><strong>Height:</strong> ${profile.height} cm | <strong>Price:</strong> $${profile.price}</p>
                        <p>${profile.desc}</p>
                        <p><strong>Phone:</strong> ${phoneDisplay}</p>
                    </div>
                `;
                container.appendChild(card);
                card.dataset.slideIndex = 0;
                card.dataset.maxSlide = profile.images_clear.length;
            });
        }

        // --- Slider & Filters Logic ---
        window.moveSlide = function(cardIndex, direction) {
            const card = document.querySelectorAll('.profile-card')[cardIndex];
            let currentSlide = parseInt(card.dataset.slideIndex);
            const maxSlide = parseInt(card.dataset.maxSlide);

            currentSlide = (currentSlide + direction + maxSlide) % maxSlide;
            card.dataset.slideIndex = currentSlide;

            const track = document.getElementById(`track-${cardIndex}`);
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        };

        function filterProfiles() {
            const sortVal = document.getElementById('sortPrice').value;
            const minAge = parseInt(document.getElementById('minAge').value) || null;
            const maxAge = parseInt(document.getElementById('maxAge').value) || null;
            const minHeight = parseInt(document.getElementById('minHeight').value) || null;
            const maxHeight = parseInt(document.getElementById('maxHeight').value) || null;
            const minPrice = parseInt(document.getElementById('minPrice').value) || null;
            const maxPrice = parseInt(document.getElementById('maxPrice').value) || null;

            let filtered = allProfiles.filter(p => {
                if (minAge !== null && p.age < minAge) return false;
                if (maxAge !== null && p.age > maxAge) return false;
                if (minHeight !== null && p.height < minHeight) return false;
                if (maxHeight !== null && p.height > maxHeight) return false;
                if (minPrice !== null && p.price < minPrice) return false;
                if (maxPrice !== null && p.price > maxPrice) return false;
                return true;
            });

            if (sortVal === 'asc') filtered.sort((a, b) => a.price - b.price);
            else if (sortVal === 'desc') filtered.sort((a, b) => b.price - a.price);

            renderProfiles(filtered);
        }

        document.querySelectorAll('.filters input, .filters select').forEach(input => {
            input.addEventListener('input', filterProfiles);
        });

        loadProfiles();
    </script>
</body>
</html>
